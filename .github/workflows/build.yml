name: Build FiveM Optimizer EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ใช้ Action ตัวนี้เพื่อโหลด cl.exe และ MSVC Environment เข้า PATH
    - name: Set up Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile C++ GUI Code
      run: |
        cl.exe /O2 /EHsc /W3 /std:c++17 main.cpp /fe:FiveM_Optimizer.exe /link User32.lib Gdi32.lib Comctl32.lib /SUBSYSTEM:WINDOWS

    - name: Upload Built EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FiveM_Optimizer_Exe
        path: FiveM_Optimizer.exe
