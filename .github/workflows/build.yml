name: Build Modern FiveM Optimizer EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile Direct2D GUI Code
      run: |
        cl.exe /O2 /EHsc /W3 /std:c++17 main.cpp /Fe"FiveM_Optimizer.exe" /link User32.lib Gdi32.lib D2d1.lib Dwrite.lib /SUBSYSTEM:WINDOWS

    - name: Upload Built EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CHELX_Cheker
        path: "**/Chelx.exe"
